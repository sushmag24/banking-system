services:
  - type: web
    name: apex-banking-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npx ng build --configuration production
    staticPublishPath: dist/frontend/browser
    headers:
      - path: /*
        name: Access-Control-Allow-Origin
        value: "*"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: apex-api-gateway
    env: docker
    rootDir: api-gateway
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
        fromService:
          type: web
          name: apex-service-registry
          property: host

  - type: web
    name: apex-service-registry
    env: docker
    rootDir: service-registry
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: PORT
        value: 8761

  - type: web
    name: apex-user-service
    env: docker
    rootDir: user-service
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "28123"
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DB_NAME
        value: user_service

  - type: web
    name: apex-account-service
    env: docker
    rootDir: account-service
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "28123"
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DB_NAME
        value: account_service

  - type: web
    name: apex-transaction-service
    env: docker
    rootDir: transaction-service
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "28123"
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DB_NAME
        value: transaction_service

  - type: web
    name: apex-fund-transfer-service
    env: docker
    rootDir: fund-transfer-service
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "28123"
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DB_NAME
        value: fund_transfer_service

  - type: web
    name: apex-sequence-generator
    env: docker
    rootDir: sequence-generator
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "28123"
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DB_NAME
        value: sequence_generator
