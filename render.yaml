services:
  - type: web
    name: apex-banking-frontend
    env: static
    buildCommand: cd frontend && npm install && npx ng build --configuration production
    staticPublishPath: frontend/dist/frontend/browser
    headers:
      - path: /*
        name: Access-Control-Allow-Origin
        value: "*"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: apex-api-gateway
    env: docker
    dockerfilePath: api-gateway/Dockerfile
    dockerContext: api-gateway
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
        fromService:
          type: web
          name: apex-service-registry
          property: host

  - type: web
    name: apex-service-registry
    env: docker
    dockerfilePath: service-registry/Dockerfile
    dockerContext: service-registry
    plan: free
    envVars:
      - key: PORT
        value: 8761

  - type: web
    name: apex-user-service
    env: docker
    dockerfilePath: user-service/Dockerfile
    dockerContext: user-service
    plan: free
    envVars:
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "28123"
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DB_NAME
        value: user_service

  - type: web
    name: apex-account-service
    env: docker
    dockerfilePath: account-service/Dockerfile
    dockerContext: account-service
    plan: free
    envVars:
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "28123"
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DB_NAME
        value: account_service

  - type: web
    name: apex-transaction-service
    env: docker
    dockerfilePath: transaction-service/Dockerfile
    dockerContext: transaction-service
    plan: free
    envVars:
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "28123"
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DB_NAME
        value: transaction_service

  - type: web
    name: apex-fund-transfer-service
    env: docker
    dockerfilePath: fund-transfer-service/Dockerfile
    dockerContext: fund-transfer-service
    plan: free
    envVars:
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "28123"
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DB_NAME
        value: fund_transfer_service

  - type: web
    name: apex-sequence-generator
    env: docker
    dockerfilePath: sequence-generator/Dockerfile
    dockerContext: sequence-generator
    plan: free
    envVars:
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "28123"
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DB_NAME
        value: sequence_generator
