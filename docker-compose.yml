version: '3.8'

services:
  # MySQL Multi-Database Engine
  mysql:
    image: mysql:8.0
    container_name: apex-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-Root@123}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Service Discovery Registry (Eureka)
  service-registry:
    build:
      context: ./service-registry
      dockerfile: Dockerfile
    container_name: apex-service-registry
    restart: always
    ports:
      - "8761:8761"
    environment:
      - SERVER_PORT=8761
      - SPRING_PROFILES_ACTIVE=prod

  # Distributed Sequence Generator
  sequence-generator:
    build:
      context: ./sequence-generator
      dockerfile: Dockerfile
    container_name: apex-sequence-generator
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_started
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DB_NAME=sequence_generator
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-Root@123}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/

  # User Service
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: apex-user-service
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_started
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DB_NAME=user_service
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-Root@123}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/

  # Account Service
  account-service:
    build:
      context: ./account-service
      dockerfile: Dockerfile
    container_name: apex-account-service
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_started
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DB_NAME=account_service
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-Root@123}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/

  # Transaction Service
  transaction-service:
    build:
      context: ./transaction-service
      dockerfile: Dockerfile
    container_name: apex-transaction-service
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_started
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DB_NAME=transaction_service
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-Root@123}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/

  # Fund Transfer Service
  fund-transfer-service:
    build:
      context: ./fund-transfer-service
      dockerfile: Dockerfile
    container_name: apex-fund-transfer-service
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      service-registry:
        condition: service_started
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DB_NAME=fund_transfer_service
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-Root@123}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/

  # Spring Cloud API Gateway
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: apex-api-gateway
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      service-registry:
        condition: service_started
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://service-registry:8761/eureka/

  # Angular Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: apex-frontend
    restart: always
    ports:
      - "4200:80"
    depends_on:
      - api-gateway

volumes:
  mysql-data:
